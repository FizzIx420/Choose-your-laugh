name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/goosebumps-comedy-cyoa-mobile/**"
      - "artifacts/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Choose Your Laugh APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Setup pnpm
      # ============================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # ============================================================
      # 3. Setup Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ============================================================
      # 4. Setup Java
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 5. Verify toolchain
      # ============================================================
      - name: Verify toolchain
        run: |
          echo "Node:"
          node --version

          echo "pnpm:"
          pnpm --version

          echo "Java:"
          java -version

      # ============================================================
      # 6. FIRST PASS:
      #    Regenerate pnpm-lock.yaml if package.json changed.
      #
      #    This intentionally uses --no-frozen-lockfile.
      #    It is ONLY for synchronizing the lockfile.
      # ============================================================
      - name: Synchronize pnpm lockfile
        run: |
          pnpm install --no-frozen-lockfile

      # ============================================================
      # 7. Commit the regenerated lockfile back to the repository.
      #
      #    If the lockfile was already correct, nothing is committed.
      # ============================================================
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
          else
            echo "pnpm-lock.yaml was updated. Committing it..."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add pnpm-lock.yaml
            git commit -m "chore: synchronize pnpm lockfile"

            git push
          fi

      # ============================================================
      # 8. SECOND PASS:
      #    CLEAN / FROZEN INSTALL
      #
      #    This is the important verification step.
      #    If package.json and pnpm-lock.yaml disagree, this FAILS.
      # ============================================================
      - name: Clean frozen dependency install
        run: |
          pnpm install --frozen-lockfile

      # ============================================================
      # 9. Check Expo
      # ============================================================
      - name: Check Expo
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile
        run: |
          pnpm exec expo --version

      # ============================================================
      # 10. Generate Android native project
      # ============================================================
      - name: Generate Android native project
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install

      # ============================================================
      # 11. Make Gradle executable
      # ============================================================
      - name: Make Gradle executable
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile/android
        run: |
          chmod +x gradlew

      # ============================================================
      # 12. Build release APK
      # ============================================================
      - name: Build release APK
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon

      # ============================================================
      # 13. Locate APK
      # ============================================================
      - name: Locate APK
        run: |
          echo "Searching for generated APK..."
          find artifacts/goosebumps-comedy-cyoa-mobile/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 14. Upload APK as GitHub Actions artifact
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: choose-your-laugh-android-apk
          path: artifacts/goosebumps-comedy-cyoa-mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30