name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/goosebumps-comedy-cyoa-mobile/**"
      - "artifacts/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Choose Your Laugh APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Setup pnpm
      # ============================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # ============================================================
      # 3. Setup Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ============================================================
      # 4. Verify Node + pnpm
      # ============================================================
      - name: Verify Node and pnpm
        run: |
          echo "Node version:"
          node --version

          echo "pnpm version:"
          pnpm --version

      # ============================================================
      # 5. Synchronize pnpm lockfile
      #
      # This is allowed to update pnpm-lock.yaml if package.json
      # contains dependencies that aren't currently represented
      # in the lockfile.
      # ============================================================
      - name: Synchronize pnpm lockfile
        run: |
          pnpm install --no-frozen-lockfile

      # ============================================================
      # 6. Commit updated lockfile if necessary
      # ============================================================
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
          else
            echo "pnpm-lock.yaml was updated."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add pnpm-lock.yaml
            git commit -m "chore: synchronize pnpm lockfile"
            git push
          fi

      # ============================================================
      # 7. CLEAN FROZEN INSTALL
      #
      # This verifies that package.json and pnpm-lock.yaml now
      # agree exactly.
      # ============================================================
      - name: Clean frozen dependency install
        run: |
          pnpm install --frozen-lockfile

      # ============================================================
      # 8. Check Expo
      # ============================================================
      - name: Check Expo
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile
        run: |
          pnpm exec expo --version

      # ============================================================
      # 9. Generate Android native project
      #
      # IMPORTANT:
      # Java/Gradle setup happens AFTER this because this step
      # creates the Android/Gradle project.
      # ============================================================
      - name: Generate Android native project
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install

      # ============================================================
      # 10. Verify Android project exists
      # ============================================================
      - name: Verify Android project
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile
        run: |
          echo "Android project contents:"
          ls -la android

          echo
          echo "Gradle wrapper:"
          ls -la android/gradlew

      # ============================================================
      # 11. Setup Java
      #
      # NOW the Gradle project exists, so Gradle caching can work.
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 12. Verify Java
      # ============================================================
      - name: Verify Java
        run: |
          java -version

      # ============================================================
      # 13. Make Gradle executable
      # ============================================================
      - name: Make Gradle executable
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile/android
        run: |
          chmod +x gradlew

      # ============================================================
      # 14. Build release APK
      # ============================================================
      - name: Build release APK
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon

      # ============================================================
      # 15. Locate APK
      # ============================================================
      - name: Locate APK
        run: |
          echo "Searching for generated APK..."

          find artifacts/goosebumps-comedy-cyoa-mobile/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 16. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: choose-your-laugh-android-apk
          path: artifacts/goosebumps-comedy-cyoa-mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30