name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/goosebumps-comedy-cyoa-mobile/**"
      - "artifacts/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Choose Your Laugh APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Expo CLI
        run: pnpm exec expo --version

      - name: Generate Android native project
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: artifacts/goosebumps-comedy-cyoa-mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        run: |
          find artifacts/goosebumps-comedy-cyoa-mobile/android/app/build/outputs/apk \
            -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: choose-your-laugh-android-apk
          path: artifacts/goosebumps-comedy-cyoa-mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30