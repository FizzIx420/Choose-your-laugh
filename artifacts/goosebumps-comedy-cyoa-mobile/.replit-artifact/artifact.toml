kind = "mobile"
previewPath = "/goosebumps-comedy-cyoa-mobile/"
title = "The Haunted Hallway of Doom — Android"
description = "An offline-first Android choose-your-own-adventure comedy game with the complete haunted-school story, local saves, replay stats, collectibles, achievements, and touch-friendly controls."
version = "1.0.0"
id = "artifacts/goosebumps-comedy-cyoa-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/goosebumps-comedy-cyoa-mobile/" ]
localPort = 24327

[services.development]
run = "pnpm --filter @workspace/goosebumps-comedy-cyoa-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/goosebumps-comedy-cyoa-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/goosebumps-comedy-cyoa-mobile", "run", "serve" ]

[services.env]
PORT = "24327"
BASE_PATH = "/goosebumps-comedy-cyoa-mobile/"
